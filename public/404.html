<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Faunexa</title>
    <script>
      // GitHub Pages solo sirve index.html en la raíz del sitio; cualquier otra
      // ruta (p. ej. /dashboard) cae aquí como 404. Este script reescribe la URL
      // como un query param y redirige a index.html, que la restaura después.
      // Patrón estándar: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // mantiene "/Faunexa_Frontend"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
